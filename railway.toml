[build]
builder = "nixpacks"
# Build frontend before starting the server.
# VITE_* env vars (set in Railway dashboard) are picked up here at build time.
buildCommand = "cd frontend && npm ci && npm run build && cd .."

[deploy]
startCommand = "uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
